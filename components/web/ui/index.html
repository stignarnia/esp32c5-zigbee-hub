<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee Hub</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <h1 id="login-title">Zigbee Hub</h1>
    <label>Admin password
      <input id="login-pw" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit">Log in</button>
    <p id="login-err" class="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><span id="dot" class="dot" title="live connection"></span><span id="hostname">hub</span></div>
    <nav>
      <a href="#devices">Devices</a>
      <a href="#automations">Automations</a>
      <a href="#status">Status</a>
      <a href="#settings">Settings</a>
    </nav>
    <button id="theme" class="ghost" aria-label="Switch between light and dark theme">☾</button>
    <button id="logout" class="ghost">Log out</button>
  </header>
  <main id="view"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
